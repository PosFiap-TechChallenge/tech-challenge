x-api-base: &api-base
  build:
    context: .
    dockerfile: Dockerfile
    target: runner
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_DATABASE}?schema=public
    DB_HOST: database
    DB_PORT: 5432

services:
  database:
    image: postgres:16-alpine
    container_name: techchallenge-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - techchallenge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_DATABASE}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Prepara o banco antes da API: aplica as migrations e cria o usuario ADMIN (idempotente).
  migrate:
    <<: *api-base
    container_name: techchallenge-migrate
    command:
      - sh
      - -c
      - ./node_modules/.bin/prisma migrate deploy --schema src/infrastructure/database/prisma/schema.prisma && node dist/seedAdmin.js
    healthcheck:
      disable: true
    depends_on:
      database:
        condition: service_healthy

  api:
    <<: *api-base
    container_name: techchallenge-api
    restart: unless-stopped
    ports:
      - '${PORT}:${PORT}'
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  techchallenge-postgres-data:
